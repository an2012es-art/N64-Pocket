name: Build N64 Pocket NDS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: N64-Pocket-NDS
          path: N64_Pocket.nds
